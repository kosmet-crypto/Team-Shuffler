plugins {
    id 'com.android.application'
}

// The web app lives at the repo root; copy it into the APK so it works offline.
def webRoot = rootProject.file('..')
tasks.register('copyWebApp', Copy) {
    from(webRoot) {
        include 'index.html', 'manifest.json', 'icons/**'
    }
    into 'src/main/assets/www'
}
preBuild.dependsOn copyWebApp

android {
    namespace 'app.teamshuffler'
    compileSdk 35

    defaultConfig {
        applicationId 'app.teamshuffler'
        minSdk 26
        targetSdk 34  // 35 forces edge-to-edge; the page does not pad for system bars in a WebView
        // CI passes the run number so each new APK installs over the previous one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        // Where the app looks for newer APKs (GitHub Releases of this repo).
        // Commit of the bundled web app, and a fingerprint of the rest of the APK (see Ota and the workflow).
        buildConfigField 'String', 'WEB_SHA', "\"${System.getenv('GITHUB_SHA') ?: ''}\""
        buildConfigField 'String', 'NATIVE_HASH', "\"${System.getenv('NATIVE_HASH') ?: ''}\""
        buildConfigField 'String', 'UPDATE_REPO', "\"${System.getenv('GITHUB_REPOSITORY') ?: 'kosmet-crypto/Team-Shuffler'}\""
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can update the installed app.
        // Fine for sideloading; use a private key (GitHub secret) before publishing to Google Play.
        release {
            storeFile file('shuffler.keystore')
            storePassword 'shuffler'
            keyAlias 'shuffler'
            keyPassword 'shuffler'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
