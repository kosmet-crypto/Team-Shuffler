<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Shuffler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #007bff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            margin-top: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
        }
        .team {
            margin-bottom: 10px;
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            border-left: 5px solid #007bff;
        }
        #secretMenu {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 2px dashed #007bff;
            border-radius: 4px;
            background: #f8f9fa;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 5px;
        }
        .checkbox-item {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .file-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .file-btns button {
            background-color: #28a745;
        }
        .file-btns button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="titleClick">Team Shuffler</h1>
    
    <div class="form-group">
        <label for="totalMembers">Total Members:</label>
        <input type="number" id="totalMembers" value="12" min="1">
    </div>

    <div class="form-group">
        <label for="numTeams">Number of Teams:</label>
        <input type="number" id="numTeams" value="3" min="1">
    </div>

    <button onclick="shuffleTeams()">Shuffle Teams</button>

    <!-- Secret Advanced Settings -->
    <div id="secretMenu">
        <h3>Advanced Rules</h3>
        
        <div class="form-group">
            <label>Must stay together (Select members):</label>
            <div id="togetherContainer" class="checkbox-grid"></div>
        </div>

        <div class="form-group">
            <label>Must be kept apart (Select members):</label>
            <div id="apartContainer" class="checkbox-grid"></div>
        </div>

        <div class="file-btns">
            <button onclick="saveData()">Save List</button>
            <button onclick="document.getElementById('fileInput').click()">Load File</button>
            <input type="file" id="fileInput" style="display:none" onchange="loadData(event)">
        </div>
    </div>

    <div class="results" id="resultsContainer">
        <h3>Results will appear here</h3>
    </div>
</div>

<script>
    let clickCount = 0;
    const titleClick = document.getElementById('titleClick');
    const secretMenu = document.getElementById('secretMenu');

    titleClick.addEventListener('click', () => {
        clickCount++;
        if (clickCount >= 5) {
            secretMenu.style.display = secretMenu.style.display === 'block' ? 'none' : 'block';
            clickCount = 0;
            updateCheckboxes();
        }
    });

    document.getElementById('totalMembers').addEventListener('input', updateCheckboxes);

    function updateCheckboxes() {
        const total = parseInt(document.getElementById('totalMembers').value) || 0;
        const togetherCont = document.getElementById('togetherContainer');
        const apartCont = document.getElementById('apartContainer');
        
        const selectedTogether = Array.from(document.querySelectorAll('.together-chk:checked')).map(cb => cb.value);
        const selectedApart = Array.from(document.querySelectorAll('.apart-chk:checked')).map(cb => cb.value);

        togetherCont.innerHTML = '';
        apartCont.innerHTML = '';

        for (let i = 1; i <= total; i++) {
            const tDiv = document.createElement('div');
            tDiv.className = 'checkbox-item';
            tDiv.innerHTML = `<input type="checkbox" class="together-chk" value="${i}" ${selectedTogether.includes(i.toString()) ? 'checked' : ''}> ${i}`;
            togetherCont.appendChild(tDiv);

            const aDiv = document.createElement('div');
            aDiv.className = 'checkbox-item';
            aDiv.innerHTML = `<input type="checkbox" class="apart-chk" value="${i}" ${selectedApart.includes(i.toString()) ? 'checked' : ''}> ${i}`;
            apartCont.appendChild(aDiv);
        }
    }

    updateCheckboxes();

    function shuffleTeams() {
        const total = parseInt(document.getElementById('totalMembers').value);
        const numTeams = parseInt(document.getElementById('numTeams').value);
        const resultsContainer = document.getElementById('resultsContainer');

        if (numTeams > total || numTeams < 1) {
            alert('Invalid number of teams or members.');
            return;
        }

        const togetherCheckboxes = document.querySelectorAll('.together-chk:checked');
        let togetherGroup = Array.from(togetherCheckboxes).map(cb => parseInt(cb.value));

        const apartCheckboxes = document.querySelectorAll('.apart-chk:checked');
        let apartGroup = Array.from(apartCheckboxes).map(cb => parseInt(cb.value));

        let teams = [];
        let maxTries = 1000;
        let success = false;

        for (let t = 0; t < maxTries; t++) {
            teams = Array.from({ length: numTeams }, () => []);
            let members = Array.from({ length: total }, (_, i) => i + 1);
            
            members.sort(() => Math.random() - 0.5);

            if (togetherGroup.length > 0) {
                let targetTeamIndex = Math.floor(Math.random() * numTeams);
                for (let member of togetherGroup) {
                    teams[targetTeamIndex].push(member);
                    members = members.filter(m => m !== member);
                }
            }

            for (let member of members) {
                let shortestTeam = 0;
                for (let i = 1; i < teams.length; i++) {
                    if (teams[i].length < teams[shortestTeam].length) {
                        shortestTeam = i;
                    }
                }
                teams[shortestTeam].push(member);
            }

            let valid = true;
            if (apartGroup.length > 1) {
                for (let team of teams) {
                    let count = apartGroup.filter(m => team.includes(m)).length;
                    if (count > 1) {
                        valid = false;
                        break;
                    }
                }
            }

            if (valid) {
                success = true;
                break;
            }
        }

        resultsContainer.innerHTML = '<h3>Generated Teams</h3>';
        teams.forEach((team, index) => {
            const teamDiv = document.createElement('div');
            teamDiv.className = 'team';
            teamDiv.innerHTML = `<strong>Team ${index + 1}:</strong> ${team.sort((a,b) => a-b).join(', ')}`;
            resultsContainer.appendChild(teamDiv);
        });
    }

    function saveData() {
        const data = {
            totalMembers: document.getElementById('totalMembers').value,
            numTeams: document.getElementById('numTeams').value,
            together: Array.from(document.querySelectorAll('.together-chk:checked')).map(cb => cb.value),
            apart: Array.from(document.querySelectorAll('.apart-chk:checked')).map(cb => cb.value)
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'team-shuffler-settings.json';
        a.click();
    }

    function loadData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                document.getElementById('totalMembers').value = data.totalMembers || 12;
                document.getElementById('numTeams').value = data.numTeams || 3;
                updateCheckboxes();

                if (data.together) {
                    data.together.forEach(val => {
                        const cb = document.querySelector(`.together-chk[value="${val}"]`);
                        if (cb) cb.checked = true;
                    });
                }
                if (data.apart) {
                    data.apart.forEach(val => {
                        const cb = document.querySelector(`.apart-chk[value="${val}"]`);
                        if (cb) cb.checked = true;
                    });
                }
                alert('Settings loaded successfully!');
            } catch (err) {
                alert('Error reading file.');
            }
        };
        reader.readAsText(file);
    }
</script>

</body>
</html>
